<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>City Services &amp; Essential Amenities – CITYMATE</title>
  <meta name="description" content="Find essential city amenities: ATMs, Petrol Bunks, Public Restrooms, Local Markets, and Bike &amp; Car Rentals powered by Supabase." />

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- CityMate Core Styles -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container navbar-container">
      <a href="index.html" class="brand-logo" title="CityMate - Home">
        <div class="brand-icon">
          <img class="brand-custom-img" src="assets/logo.png" alt="CityMate Logo" onerror="this.src='https://images.unsplash.com/photo-1582510003544-4d00b7f74220?w=100'" />
        </div>
        <div class="brand-text">CITY<span>MATE</span></div>
      </a>

      <!-- Desktop Menu -->
      <nav>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a></li>
          <li><a href="places.html" class="nav-link"><i class="fa-solid fa-mountain-sun"></i> Places</a></li>
          <li><a href="hotels.html" class="nav-link"><i class="fa-solid fa-hotel"></i> Hotels</a></li>
          <li><a href="restaurants.html" class="nav-link"><i class="fa-solid fa-utensils"></i> Restaurants</a></li>
          <li><a href="hospitals.html" class="nav-link"><i class="fa-solid fa-hospital"></i> Hospitals</a></li>
          <li><a href="services.html" class="nav-link active"><i class="fa-solid fa-bell-concierge"></i> Services</a></li>
          <li><a href="map.html" class="nav-link"><i class="fa-solid fa-map-location-dot"></i> Map</a></li>
          <li><a href="planner.html" class="nav-link"><i class="fa-solid fa-route"></i> Planner</a></li>
        </ul>
      </nav>

      <!-- Nav Actions -->
      <div class="nav-actions">
        <button id="theme-toggle-btn" class="theme-toggle-btn" title="Toggle theme">
          <i class="fa-solid fa-sun icon-sun"></i>
          <i class="fa-solid fa-moon icon-moon"></i>
        </button>

        <div id="nav-guest-actions" style="display: flex; gap: 8px;">
          <a href="login.html" class="btn btn-secondary btn-sm"><i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In</a>
          <a href="register.html" class="btn btn-primary btn-sm"><i class="fa-solid fa-user-plus"></i> Register</a>
        </div>

        <div id="nav-user-actions" style="display: none; align-items: center; gap: 10px;">
          <a href="profile.html" class="user-nav-btn" style="text-decoration: none;" title="View Profile">
            <img id="nav-user-avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150" alt="Avatar" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover;" />
            <span id="nav-user-name" style="font-weight: 700; font-size: 0.92rem; color: #fff;">Traveler</span>
          </a>
          <button class="btn btn-secondary btn-sm" onclick="window.authCtrl.logout()"><i class="fa-solid fa-power-off"></i> Logout</button>
        </div>

        <button id="mobile-nav-toggle" class="mobile-nav-toggle" aria-label="Toggle navigation"><i class="fa-solid fa-bars"></i></button>
      </div>
    </div>
  </header>

  <!-- Page Header Banner -->
  <div class="page-header-banner">
    <div class="container">
      <span class="badge badge-primary" style="margin-bottom: 10px;">
        <i class="fa-solid fa-bell-concierge"></i> City Infrastructure &amp; Services
      </span>
      <h1 class="page-header-title">Essential City Services</h1>
      <p class="page-header-subtitle">
        Find ATMs, 24/7 petrol bunks, clean public restrooms, vibrant markets, and car &amp; bike rental hubs.
      </p>
    </div>
  </div>

  <!-- Main Content -->
  <main class="container" style="padding-bottom: 80px;">

    <!-- Toolbar: Search & City Filter -->
    <div class="filter-toolbar">
      <div class="filter-search-box">
        <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted);"></i>
        <input type="text" id="services-search-input" placeholder="Search services by name, type, or area..." oninput="window.servicesManager.setSearchQuery(this.value)" />
      </div>

      <div class="filter-group">
        <select id="services-city-select" class="filter-select" onchange="window.servicesManager.setCityFilter(this.value)">
          <option value="all">All Cities</option>
        </select>
      </div>
    </div>

    <!-- Category Pills Filter -->
    <div class="category-pill-group">
      <button class="category-pill active" data-type="all" onclick="window.servicesManager.setServiceType('all', this)">
        <i class="fa-solid fa-border-all"></i> All Services
      </button>
      <button class="category-pill" data-type="ATM" onclick="window.servicesManager.setServiceType('ATM', this)">
        <i class="fa-solid fa-money-bill-transfer"></i> ATMs
      </button>
      <button class="category-pill" data-type="Petrol Bunk" onclick="window.servicesManager.setServiceType('Petrol Bunk', this)">
        <i class="fa-solid fa-gas-pump"></i> Petrol Bunks
      </button>
      <button class="category-pill" data-type="Restroom" onclick="window.servicesManager.setServiceType('Restroom', this)">
        <i class="fa-solid fa-restroom"></i> Restrooms
      </button>
      <button class="category-pill" data-type="Market" onclick="window.servicesManager.setServiceType('Market', this)">
        <i class="fa-solid fa-store"></i> Markets &amp; Bazaars
      </button>
      <button class="category-pill" data-type="Bike Rental" onclick="window.servicesManager.setServiceType('Bike Rental', this)">
        <i class="fa-solid fa-motorcycle"></i> Bike Rentals
      </button>
      <button class="category-pill" data-type="Car Rental" onclick="window.servicesManager.setServiceType('Car Rental', this)">
        <i class="fa-solid fa-car"></i> Car Rentals
      </button>
      <button class="category-pill" data-type="Hospital" onclick="window.servicesManager.setServiceType('Hospital', this)">
        <i class="fa-solid fa-hospital"></i> Hospitals
      </button>
      <button class="category-pill" data-type="Hotel" onclick="window.servicesManager.setServiceType('Hotel', this)">
        <i class="fa-solid fa-hotel"></i> Hotels
      </button>
      <button class="category-pill" data-type="Restaurant" onclick="window.servicesManager.setServiceType('Restaurant', this)">
        <i class="fa-solid fa-utensils"></i> Restaurants
      </button>
    </div>

    <!-- Services Grid -->
    <div id="services-grid" class="cards-grid">
      <!-- Dynamically rendered from Supabase services table -->
    </div>

  </main>

  <div id="toast-container" class="toast-container"></div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- CityMate Core Scripts -->
  <script src="js/data.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/services.js"></script>
  <script src="js/script.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Check if URL has ?type= query
      const params = new URLSearchParams(window.location.search);
      const reqType = params.get('type') || 'all';

      window.servicesManager.activeServiceType = reqType;
      await window.servicesManager.initCityDropdown('services-city-select');

      // Set active category pill
      document.querySelectorAll('.category-pill').forEach(el => {
        el.classList.toggle('active', el.dataset.type === reqType);
      });

      window.servicesManager.renderServicesGrid('services-grid');
    });
  </script>
</body>
</html>
