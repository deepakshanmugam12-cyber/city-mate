<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In – CITYMATE</title>
  <meta name="description" content="Sign in to your CityMate account with Supabase to access personalized recommendations, saved favorites, and tourist itineraries." />

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- CityMate Core Styles -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/png" href="assets/logo.png" />

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 80% 20%, rgba(13, 148, 136, 0.22) 0%, transparent 50%),
                  radial-gradient(circle at 20% 80%, rgba(2, 132, 199, 0.18) 0%, transparent 50%),
                  var(--bg-dark);
    }

    .login-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .login-box {
      width: 100%;
      max-width: 480px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 40px 36px;
      box-shadow: var(--shadow-lg), var(--shadow-teal);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      position: relative;
    }

    .login-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 30px;
      right: 30px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary-light), transparent);
    }

    .login-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .login-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 8px;
    }

    .login-brand .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.1rem;
      box-shadow: var(--shadow-teal);
    }

    .login-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .login-subtitle {
      font-size: 0.92rem;
      color: var(--text-secondary);
    }

    .error-alert {
      display: none;
      align-items: center;
      gap: 10px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      margin-bottom: 20px;
      color: #fca5a5;
      font-size: 0.88rem;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .password-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px;
    }

    .password-toggle:hover {
      color: #fff;
    }

    .form-control-icon {
      padding-left: 42px;
      padding-right: 42px;
    }

    .login-footer-links {
      text-align: center;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border-subtle);
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .login-footer-links a {
      color: var(--primary-light);
      font-weight: 600;
      transition: var(--transition-fast);
      text-decoration: none;
    }

    .login-footer-links a:hover {
      color: #fff;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Minimal Nav -->
  <header class="navbar">
    <div class="container navbar-container">
      <a href="index.html" class="brand-logo" title="CityMate - Return to Home">
        <div class="brand-icon">
          <img class="brand-custom-img" src="assets/logo.png" style="width:100%;height:100%;object-fit:cover;border-radius:8px;" alt="Logo" onerror="this.src='https://images.unsplash.com/photo-1582510003544-4d00b7f74220?w=100'" />
        </div>
        <div class="brand-text">CITY<span>MATE</span></div>
      </a>
      <div class="nav-actions">
        <a href="register.html" class="btn btn-primary btn-sm">
          <i class="fa-solid fa-user-plus"></i> Create Account
        </a>
      </div>
    </div>
  </header>

  <!-- Login Form Wrapper -->
  <div class="login-wrapper">
    <div class="login-box">
      <div class="login-header">
        <div class="login-brand">
          <div class="brand-icon"><i class="fa-solid fa-lock"></i></div>
          <span>CITYMATE</span>
        </div>
        <h1 class="login-title">Sign In</h1>
        <p class="login-subtitle">Sign in to CityMate with your Supabase credentials.</p>
      </div>

      <!-- Error Alert Message -->
      <div id="login-error-alert" class="error-alert">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span id="login-error-text">Invalid login credentials.</span>
      </div>

      <!-- Login Form -->
      <form id="citymate-login-form" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input type="email" id="login-email" class="form-control form-control-icon" required placeholder="Enter your registered email" autocomplete="email" />
          </div>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <label class="form-label" for="login-password" style="margin-bottom: 0;">Password</label>
          </div>
          <div class="input-wrapper">
            <i class="fa-solid fa-key input-icon"></i>
            <input type="password" id="login-password" class="form-control form-control-icon" required placeholder="Enter your password" autocomplete="current-password" />
            <button type="button" class="password-toggle" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
              <i id="password-toggle-icon" class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="btn-submit-login" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
          <span id="btn-login-text"><i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to CityMate</span>
          <i id="btn-login-spinner" class="fa-solid fa-spinner fa-spin" style="display: none;"></i>
        </button>
      </form>

      <div class="login-footer-links">
        <p>Don't have an account yet? <a href="register.html">Register Now</a></p>
        <p style="margin-top: 8px;">
          <a href="index.html">&larr; Return to CityMate Home</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Supabase JS SDK (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Supabase Credentials Config -->
  <script>
    window.CITYMATE_CONFIG = {
      supabaseUrl: 'https://eusjujcooyzskzddrdkk.supabase.co',
      supabaseKey: 'sb_publishable_FDf32Zq4webrCfKeIx3rTQ_b4iFXluk'
    };
  </script>

  <!-- CityMate Scripts -->
  <script src="js/data.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/script.js"></script>

  <script>
    function togglePasswordVisibility() {
      const input = document.getElementById('login-password');
      const icon = document.getElementById('password-toggle-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye';
      }
    }

    function showError(msg) {
      const alert = document.getElementById('login-error-alert');
      const text = document.getElementById('login-error-text');
      text.innerHTML = msg;
      alert.style.display = 'flex';
    }

    function hideError() {
      document.getElementById('login-error-alert').style.display = 'none';
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      hideError();

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      if (!email || !password) {
        showError('Please enter both your email address and password.');
        return;
      }

      const btn = document.getElementById('btn-submit-login');
      const text = document.getElementById('btn-login-text');
      const spinner = document.getElementById('btn-login-spinner');

      btn.disabled = true;
      text.style.display = 'none';
      spinner.style.display = 'inline-block';

      const urlParams = new URLSearchParams(window.location.search);
      const nextUrl = urlParams.get('next') || 'index.html';

      try {
        await window.authCtrl.login(email, password);

        if (window.showToast) {
          window.showToast('Signed in successfully! Redirecting...', 'success');
        }

        setTimeout(() => {
          window.location.href = nextUrl;
        }, 500);

      } catch (err) {
        console.error('[Login] Supabase Auth Error:', err);
        const errMsg = err.message || 'Invalid email or password. Please try again.';
        if (errMsg.toLowerCase().includes('invalid email or password')) {
          showError(errMsg + '<div style="margin-top: 8px; font-size: 0.86rem; color: #cbd5e1; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 6px;">Don\'t have an account yet? <a href="register.html" style="color: #38bdf8; text-decoration: underline; font-weight: 600;">Click here to Create Account &rarr;</a></div>');
        } else {
          showError(errMsg);
        }
      } finally {
        btn.disabled = false;
        text.style.display = 'inline-flex';
        spinner.style.display = 'none';
      }
    }
  </script>
</body>
</html>
